<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=A.joshy/" />
  <title>Wedding Invitation</title>
  <style>
    :root {
      --bg: #f7d7ef;
      --card: rgba(120, 2, 105, 0.82);
      --text: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #f5d5ef 0%, #e080cc 30%, #b840a8 60%, #780269 100%);
      color: var(--text);
    }
    .box {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 18px;
      padding: 24px 28px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(69, 0, 59, 0.28);
    }
    a {
      color: var(--text);
      text-decoration: underline;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <p>Redirecting to the wedding invitation...</p>
    <p><a href="A.joshy/">Open invitation</a></p>
  </div>

  <script>
    window.location.replace('A.joshy/');
  </script>
</body>
</html>
